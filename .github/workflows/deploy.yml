name: Deploy Smart AI Finance Advisor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build SAM template
        run: sam build --template infra/template.yaml

      - name: Deploy SAM stack
        id: deploy
        run: |
          sam deploy \
            --stack-name smart-ai-personal-finance-advisor \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Get Stack Outputs
        id: outputs
        run: |
          OUTPUT=$(aws cloudformation describe-stacks \
            --stack-name smart-ai-personal-finance-advisor \
            --region ap-southeast-1 \
            --query 'Stacks[0].Outputs' \
            --output json)
          echo "Stack outputs: $OUTPUT"
          
          # Extract outputs
          MONTHLY_SAVINGS_URL=$(echo "$OUTPUT" | jq -r '.[] | select(.OutputKey=="MonthlySavingsSummaryUrl") | .OutputValue')
          WEBSITE_URL=$(echo "$OUTPUT" | jq -r '.[] | select(.OutputKey=="WebsiteUrl") | .OutputValue')
          BUCKET_NAME=$(echo "$OUTPUT" | jq -r '.[] | select(.OutputKey=="BucketName") | .OutputValue')
          
          echo "monthly_savings_url=$MONTHLY_SAVINGS_URL" >> $GITHUB_OUTPUT
          echo "website_url=$WEBSITE_URL" >> $GITHUB_OUTPUT
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          
          echo "Extracted URLs:"
          echo "  Monthly Savings: $MONTHLY_SAVINGS_URL"
          echo "  Website: $WEBSITE_URL"
          echo "  Bucket: $BUCKET_NAME"

      - name: Update Frontend with Lambda URLs
        run: |
          # Copy frontend to temp directory
          cp -r frontend frontend_build
          
          # Replace placeholder URLs in index.html
          sed -i "s|__URL_MONTHLY_SAVINGS_SUMMARY__|${{ steps.outputs.outputs.monthly_savings_url }}|g" frontend_build/index.html
          
          echo "Updated frontend URLs:"
          grep "const STREAM_URLS" frontend_build/index.html -A 2

      - name: Deploy Frontend to S3
        run: |
          aws s3 sync frontend_build/ \
            s3://${{ steps.outputs.outputs.bucket_name }}/ \
            --delete \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront (if applicable)
        continue-on-error: true
        run: |
          # If you set up CloudFront distribution later, add invalidation here
          echo "CloudFront invalidation skipped (not configured yet)"

      - name: Deployment Summary
        run: |
          echo "✅ Deployment Complete!"
          echo ""
          echo "🌐 Website URL: ${{ steps.outputs.outputs.website_url }}"
          echo "⚡ Lambda Endpoint: ${{ steps.outputs.outputs.monthly_savings_url }}"
          echo "📦 S3 Bucket: ${{ steps.outputs.outputs.bucket_name }}"
          echo ""
          echo "Next steps:"
          echo "1. Visit: ${{ steps.outputs.outputs.website_url }}"
          echo "2. Fill in your financial information"
          echo "3. Click 'Run All' to get personalized advice"
